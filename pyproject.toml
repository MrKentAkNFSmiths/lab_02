[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "streamstats"
version = "0.1.0"
description = "Потоковый анализатор логов (CSV и JSONL)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
streamstats = "streamstats.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8"
]